name: iOS build

# Builds an unsigned Blokzen.ipa on a cloud Mac. Sideloadly (or AltStore) signs it
# with your own Apple ID when you install it on your iPhone.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Copy the game into the iOS project
        run: npx cap sync ios

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 40
          test -d build/Build/Products/Release-iphoneos/App.app

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr Blokzen.ipa Payload
          ls -lh Blokzen.ipa
          APP=Payload/App.app
          SIZE=$(du -h Blokzen.ipa | cut -f1)
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' $APP/Info.plist)
          BID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' $APP/Info.plist)
          test -f $APP/public/index.html
          HAPTICS=$(grep -rl CapacitorHaptics $APP 2>/dev/null | head -1 | xargs -I{} basename {} || true)
          echo "::notice title=IPA::name=$NAME id=$BID size=$SIZE game=ok haptics=${HAPTICS:-missing} icon=$(test -f $APP/Assets.car && echo ok)"

      - name: Publish to the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Blokzen.ipa \
            --title "Blokzen iPhone test build #${{ github.run_number }}" \
            --notes "Unsigned build. Install on your iPhone with Sideloadly using your Apple ID." \
            --latest

      - uses: actions/upload-artifact@v4
        with:
          name: Blokzen-ipa
          path: Blokzen.ipa
          retention-days: 30
